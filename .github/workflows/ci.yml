name: CivicSync checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The initial ZIP has no fabricated lockfile. Commit the lockfile created
      # by the first successful install; subsequent runs use npm ci.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run test
      - run: npm run check:source
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: local_disposable_test_only
          POSTGRES_USER: postgres
          POSTGRES_DB: civicsync_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:sql
        env:
          CIVICSYNC_TEST_DATABASE_URL: postgresql://postgres:local_disposable_test_only@127.0.0.1:5432/civicsync_test_ci
